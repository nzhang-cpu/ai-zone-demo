<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search results — Northline Help</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23020642'/%3E%3Cpath d='M8 17.5l5 5 11-12' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./site.css?v=55" />
  </head>
  <body data-page="search" data-summary-placement="below-search">
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 3l1.6 4.8L18.5 9.5 13.6 11 12 16l-1.6-5L5.5 9.5 10.4 7.8 12 3z" />
          </svg>
        </span>
        Northline Help
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="search.html" aria-current="page">Articles</a>
        <a class="btn-primary" href="submit.html">Submit a case</a>
      </nav>
    </header>

    <main id="main">
      <div class="wrap">
        <div class="summary-frame">
          <div class="summary-main">
            <div id="results-view">
              <div class="results-heading">
                <div class="results-heading__title">
                  <h1 id="results-title">Browse help articles</h1>
                  <button type="button" class="results-search-btn" id="results-search-btn" aria-expanded="false" aria-controls="results-search">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                      <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
                    </svg>
                    <span class="visually-hidden">Search</span>
                  </button>
                </div>
                <form id="results-search" class="search-shell search-shell--compact results-search" data-search-form role="search" hidden>
                  <div class="search-top">
                    <div class="search-input-wrap">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
                      </svg>
                      <input type="search" name="q" placeholder="Search articles, or describe your issue" aria-label="Search help articles" autocomplete="off" />
                    </div>
                    <button type="submit" class="btn-send" aria-label="Search">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13" /><path d="M22 2L15 22L11 13L2 9L22 2Z" />
                      </svg>
                    </button>
                  </div>
                  <div class="suggest" data-suggest></div>
                </form>
              </div>
              <p class="results-meta" id="results-meta"></p>
              <div data-summary-slot></div>
              <div class="topic-row">
                <span class="label">Topic</span>
                <div class="chips" id="topic-filters"></div>
              </div>
              <div class="panel" id="result-list"></div>
            </div>
            <div id="article-view" hidden></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <span>Northline Help Center</span>
      <nav aria-label="Footer">
        <a href="index.html">Home</a>
        <a href="search.html">Articles</a>
        <a href="submit.html">Submit a case</a>
      </nav>
    </footer>
    <script src="./site.js?v=55"></script>
  </body>
</html>
